<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>플로트와 포지션</title>
    <style>
      .float-box {
        width: 100px;
        height: 100px;
        background-color: brown;
        float: left;
      }
      .float-box-right {
        width: 100px;
        height: 100px;
        background-color: brown;
        float: right;
      }
      .container {
        border: 1px solid yellowgreen;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="float-box">박스</div>
      <div class="float-box">박스</div>
      <div class="float-box-right">박스</div>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Sed provident
      amet ullam? Ratione dolor omnis doloremque assumenda, sit placeat!
      Sapiente dolore laborum voluptatum labore minima dolor incidunt
      dignissimos ea dicta.
    </div>
    <!--자식 요소가 모두 float면 스스로의 height를 가지지 못함(content)-->
    <div class="container" style="overflow: hidden">
      <!--(float) clear : both (left+right)-->
      <div style="clear: both"></div>
      <!--2. float가 밑으로 쳐져도 float들끼리는 충돌해서 서로의 영역을 침범하지 않음-->
      <div class="float-box">박스1</div>
      <div class="float-box">박스2</div>
      <div class="float-box-right">박스3</div>
    </div>
    <hr />
    <!--emmet => 선택자의 문법을 바탕으로 (이외에도 좀 플러스) 간단하게 html 태그를 구조화하며 만들 수 있는 단툭어-->
    <br /><br /><br /><br /><br /><br /><br /><br /><br /><br />
  </body>
</html>
